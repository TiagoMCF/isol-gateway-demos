name: AI review (iSol API)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }

      - name: Ask the gateway to review the change
        env:
          ISOL_API_KEY: ${{ secrets.ISOL_API_KEY }}
        run: |
          DIFF=$(git diff HEAD~1 2>/dev/null || git show --stat HEAD; git show HEAD | head -120)
          BODY=$(jq -n --arg diff "$DIFF" '{
            model: "isol-4.9",
            messages: [
              {role:"system", content:"You are a strict code reviewer. Always reply in English. If the diff exposes a secret or password, start with **SECURITY:** and say which line. Reply in GitHub-flavored markdown: 2-4 bullet findings, then a one-line verdict."},
              {role:"user", content:("Review this change:\n```diff\n" + $diff + "\n```")}
            ]
          }')
          REVIEW=$(curl -s https://tokens.4clouders.com/v1/chat/completions \
            -H "Authorization: Bearer $ISOL_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY" | jq -r '.choices[0].message.content')
          echo "$REVIEW"
          { echo "### 🤖 AI review · iSol API"; echo; echo "$REVIEW"; echo; echo "_Model: isol-4.9 · endpoint: tokens.4clouders.com/v1_"; } > review.md
          echo "## 🤖 AI review · iSol API" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$REVIEW" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "_Model: isol-4.9 · endpoint: tokens.4clouders.com/v1 · one key per repo, with its own spending cap._" >> "$GITHUB_STEP_SUMMARY"

      - name: Post the review on the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -f body="$(cat review.md)" > /dev/null
